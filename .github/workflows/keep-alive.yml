name: Keep Alive

on:
  schedule:
    - cron: '*/14 * * * *'  # every 14 min to prevent Render free tier sleep
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          curl -fsS "${{ secrets.API_BASE_URL }}/health" || curl -fsS "https://placeholder.onrender.com/health" || true
